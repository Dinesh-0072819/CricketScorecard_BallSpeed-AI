services:
  - type: web
    name: cricspeed-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: ./render-build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PITCH_LENGTH_M
        value: "20.12"
      - key: USE_ROBOFLOW_CLOUD
        value: "true"
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL
        sync: false
      - key: CLOUD_FAST
        value: "true"
