{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

<h1 class="page-title">📊 Bowling Analytics Dashboard</h1>

<div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <!-- Top Stats Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px;">
        <div style="background: #1E293B; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            <div style="color: #94A3B8; font-size: 14px; text-transform: uppercase; font-weight: 600;">Total Deliveries</div>
            <div id="stat-total" style="font-size: 36px; font-weight: 800; color: #38BDF8; margin-top: 10px;">0</div>
        </div>
        <div style="background: #1E293B; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            <div style="color: #94A3B8; font-size: 14px; text-transform: uppercase; font-weight: 600;">Peak Speed</div>
            <div id="stat-peak" style="font-size: 36px; font-weight: 800; color: #EF4444; margin-top: 10px;">0.0 km/h</div>
        </div>
        <div style="background: #1E293B; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            <div style="color: #94A3B8; font-size: 14px; text-transform: uppercase; font-weight: 600;">Average Speed</div>
            <div id="stat-avg" style="font-size: 36px; font-weight: 800; color: #22C55E; margin-top: 10px;">0.0 km/h</div>
        </div>
        <div style="background: #1E293B; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            <div style="color: #94A3B8; font-size: 14px; text-transform: uppercase; font-weight: 600;">Alarm Rate</div>
            <div id="stat-alarms" style="font-size: 36px; font-weight: 800; color: #F59E0B; margin-top: 10px;">0%</div>
        </div>
    </div>

    <!-- Chart Containers -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 30px;">
        <!-- Line Chart: Speed Trend -->
        <div style="background: #1E293B; border-radius: 16px; padding: 25px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.25);">
            <h3 style="margin-bottom: 20px; color: #F8FAFC;">📈 Bowling Velocity Progression</h3>
            <div style="height: 350px; position: relative;">
                <canvas id="speedTrendChart"></canvas>
            </div>
        </div>

        <!-- Bar Chart: Speed Brackets -->
        <div style="background: #1E293B; border-radius: 16px; padding: 25px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.25);">
            <h3 style="margin-bottom: 20px; color: #F8FAFC;">📊 Speed Bracket Distribution</h3>
            <div style="height: 350px; position: relative;">
                <canvas id="speedDistChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Fetch analytics statistics and render graphs
        fetch("/analytics_data")
        .then(response => response.json())
        .then(data => {
            // Update stats counter cards
            document.getElementById("stat-total").innerText = data.total_runs;
            document.getElementById("stat-peak").innerText = data.peak_speed.toFixed(1) + " km/h";
            document.getElementById("stat-avg").innerText = data.avg_speed.toFixed(1) + " km/h";
            document.getElementById("stat-alarms").innerText = data.alarm_rate.toFixed(0) + "%";

            // Render Charts
            renderCharts(data);
        })
        .catch(err => console.error("Error loading analytics data:", err));
    });

    function renderCharts(data) {
        // --- 1. Speed Trend Line Chart ---
        const trendCtx = document.getElementById('speedTrendChart').getContext('2d');
        const trendLabels = data.recent_runs.map((_, index) => `#${index + 1}`);
        const trendData = data.recent_runs.map(run => run.speed);
        
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: trendLabels,
                datasets: [{
                    label: 'Ball Speed (km/h)',
                    data: trendData,
                    borderColor: '#38BDF8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#38BDF8',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94A3B8' },
                        min: 20
                    },
                    x: {
                        grid: { color: 'transparent' },
                        ticks: { color: '#94A3B8' }
                    }
                }
            }
        });

        // --- 2. Speed Bracket Distribution Chart ---
        const distCtx = document.getElementById('speedDistChart').getContext('2d');
        const brackets = {
            'Slow (<50)': 0,
            'Medium (50-65)': 0,
            'Fast-Medium (65-80)': 0,
            'Fast (>80)': 0
        };

        data.all_runs.forEach(run => {
            if (run.speed < 50) brackets['Slow (<50)']++;
            else if (run.speed < 65) brackets['Medium (50-65)']++;
            else if (run.speed < 80) brackets['Fast-Medium (65-80)']++;
            else brackets['Fast (>80)']++;
        });

        new Chart(distCtx, {
            type: 'bar',
            data: {
                labels: Object.keys(brackets),
                datasets: [{
                    label: 'Count',
                    data: Object.values(brackets),
                    backgroundColor: [
                        'rgba(56, 189, 248, 0.7)',
                        'rgba(34, 197, 94, 0.7)',
                        'rgba(245, 158, 11, 0.7)',
                        'rgba(239, 68, 68, 0.7)'
                    ],
                    borderColor: [
                        '#38BDF8', '#22C55E', '#F59E0B', '#EF4444'
                    ],
                    borderWidth: 1.5,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94A3B8', stepSize: 1 }
                    },
                    x: {
                        grid: { color: 'transparent' },
                        ticks: { color: '#94A3B8' }
                    }
                }
            }
        });
    }
</script>
{% endblock %}
